# DeerFlow Configuration
# Generated by 'make setup' on 2026-05-20
# Run 'make setup' to reconfigure, or edit this file for advanced options.
# Full reference: config.example.yaml

config_version: 9
log_level: info
token_usage:
  enabled: true

models:
- name: gemini-3-1-pro
  display_name: Gemini 3.1 Pro
  use: langchain_google_genai:ChatGoogleGenerativeAI
  model: gemini-3.1-pro-preview
  vertexai: true
  supports_thinking: true
  when_thinking_enabled:
    thinking_level: "high"
  when_thinking_disabled:
    thinking_level: "low"

- name: gemini-3-5-flash
  display_name: Gemini 3.5 Flash
  use: langchain_google_genai:ChatGoogleGenerativeAI
  model: gemini-3.5-flash
  vertexai: true
  supports_thinking: true
  when_thinking_enabled:
    thinking_level: "medium"
  when_thinking_disabled:
    thinking_level: "minimal"

- name: gemini-3.1-flash-lite
  display_name: Gemini 3.1 Flash Lite
  use: langchain_google_genai:ChatGoogleGenerativeAI
  model: gemini-3.1-flash-lite
  vertexai: true
  supports_thinking: true
  when_thinking_enabled:
    thinking_level: "low"
  when_thinking_disabled:
    thinking_level: "minimal"

- name: gemini-3-flash-preview
  display_name: Gemini 3 Flash
  use: langchain_google_genai:ChatGoogleGenerativeAI
  model: gemini-3-flash-preview
  vertexai: true
  supports_thinking: true
  when_thinking_enabled:
    thinking_level: "high"
  when_thinking_disabled:
    thinking_level: "minimal"

- name: claude-opus-4-7
  display_name: Claude Opus 4.7
  use: langchain_google_vertexai.model_garden:ChatAnthropicVertex
  model: claude-opus-4-7
  location: us-east5

- name: claude-sonnet-4-6
  display_name: Claude Sonnet 4.6
  use: langchain_google_vertexai.model_garden:ChatAnthropicVertex
  model: claude-sonnet-4-6
  location: us-east5
  
- name: claude-haiku-4-5
  display_name: Claude Haiku 4.5
  use: langchain_google_vertexai.model_garden:ChatAnthropicVertex
  model: claude-haiku-4-5@20251001
  location: us-east5
  
tool_groups:
- name: web
- name: file:read
- name: file:write
- name: bash
tools:
- name: web_search
  use: deerflow.community.ddg_search.tools:web_search_tool
  group: web
  max_results: 5
- name: web_fetch
  use: deerflow.community.jina_ai.tools:web_fetch_tool
  group: web
  timeout: 10
- name: image_search
  group: web
  use: deerflow.community.image_search.tools:image_search_tool
  max_results: 5
- name: ls
  group: file:read
  use: deerflow.sandbox.tools:ls_tool
- name: read_file
  group: file:read
  use: deerflow.sandbox.tools:read_file_tool
- name: glob
  group: file:read
  use: deerflow.sandbox.tools:glob_tool
  max_results: 200
- name: grep
  group: file:read
  use: deerflow.sandbox.tools:grep_tool
  max_results: 100
- name: write_file
  use: deerflow.sandbox.tools:write_file_tool
  group: file:write
- name: str_replace
  use: deerflow.sandbox.tools:str_replace_tool
  group: file:write
- name: bash
  use: deerflow.sandbox.tools:bash_tool
  group: bash
tool_search:
  enabled: false
loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50
uploads:
  max_files: 10
  max_file_size: 52428800
  max_total_size: 104857600
  auto_convert_documents: false
  pdf_converter: auto
sandbox:
  use: deerflow.community.aio_sandbox:AioSandboxProvider
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000
skills:
  container_path: /mnt/skills
title:
  enabled: true
  max_words: 6
  max_chars: 60
  model_name: null
summarization:
  enabled: true
  model_name: null
  trigger:
  - type: tokens
    value: 15564
  keep:
    type: messages
    value: 10
  trim_tokens_to_summarize: 15564
  summary_prompt: null
  preserve_recent_skill_count: 5
  preserve_recent_skill_tokens: 25000
  preserve_recent_skill_tokens_per_skill: 5000
  skill_file_read_tool_names:
  - read_file
  - read
  - view
  - cat
memory:
  enabled: true
  storage_path: memory.json
  debounce_seconds: 30
  model_name: null
  max_facts: 100
  fact_confidence_threshold: 0.7
  injection_enabled: true
  max_injection_tokens: 2000
agents_api:
  enabled: true
skill_evolution:
  enabled: false
  moderation_model_name: null
database:
  backend: sqlite
  sqlite_dir: .deer-flow/data
run_events:
  backend: memory
  max_trace_content: 10240
  track_token_usage: true
