name: Build & Push (DEV)

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}   # e.g. deerflowacr.azurecr.io
  IMAGE_PREFIX: alan-deerflow                      # → deer-flow-gateway, deer-flow-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            dockerfile: backend/Dockerfile
            target: ""
          - name: frontend
            dockerfile: frontend/Dockerfile
            target: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ACR login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=dev-latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:cache
          cache-to: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:cache,mode=max
